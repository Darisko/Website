<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6750a4" />
    <meta name="description" content="Darisko's personal dashboard." />
    <title>Dashboard — Darisko</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Flex:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        const savedTheme = localStorage.getItem("daylight-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (savedTheme === "dark" || (!savedTheme && prefersDark)) document.documentElement.dataset.theme = "dark";
      } catch {}
    </script>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <main class="dashboard">
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="Darisko dashboard">
          <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7.2 7.2 0 0 1-9-9Z"/><path d="M18 3v4m-2-2h4"/></svg></span>
          <span>Darisko</span>
        </a>
        <nav class="primary-nav" aria-label="Main navigation">
          <a class="nav-item active" href="index.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
          <a class="nav-item" href="stats.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5m0 14h17M8 15v-4m5 4V7m5 8V9"/></svg><span>Stats</span></a>
          <a class="nav-item" href="about.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.5-3.4 3.2-5.5 7-5.5s6.5 2.1 7 5.5"/></svg><span>About</span></a>
        </nav>
        <div class="topbar-right">
          <span class="workspace-label">Personal space</span>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false">
            <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.1 15.4A8.5 8.5 0 0 1 8.6 3.9 8.7 8.7 0 1 0 20.1 15.4Z"/></svg>
            <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
          </button>
        </div>
      </header>

      <section class="welcome" id="home">
        <p class="overline">YOUR DASHBOARD</p>
        <h1>Your space, your way.</h1>
        <p class="subtitle">Choose a place to start.</p>
      </section>

      <section class="empty-card home-card" aria-labelledby="emptyTitle">
        <div class="empty-illustration" aria-hidden="true">
          <span class="illustration-sun"></span>
          <span class="illustration-card card-back"></span>
          <span class="illustration-card card-front"><i></i><i></i><i></i></span>
          <span class="illustration-star star-one">✦</span>
          <span class="illustration-star star-two">✧</span>
        </div>
        <p class="overline">A FRESH START</p>
        <h2 id="emptyTitle">What would you like to see?</h2>
        <p class="empty-copy">Your dashboard is ready when you are.</p>
        <nav class="destination-list" aria-label="Dashboard sections">
          <a class="destination-card" href="stats.html">
            <span class="destination-icon stats-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h17M8 15v-4m5 4V7m5 8V9"/></svg></span>
            <span class="destination-copy"><strong>Stats</strong><small>Your stats space</small></span>
            <span class="destination-arrow" aria-hidden="true">→</span>
          </a>
          <a class="destination-card" href="about.html">
            <span class="destination-icon about-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.5-3.4 3.2-5.5 7-5.5s6.5 2.1 7 5.5"/></svg></span>
            <span class="destination-copy"><strong>About me</strong><small>A little about you</small></span>
            <span class="destination-arrow" aria-hidden="true">→</span>
          </a>
        </nav>
      </section>

      <footer class="footer"><span>Made for a little more breathing room</span><span class="footer-sparkle" aria-hidden="true">✦</span></footer>
    </main>
  </body>
</html>
